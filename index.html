<style>
/* LifeCasts Radio : barre du bas extensible (façon Bible) + Compte (structure commune). */
:root{--bg:#f2f2f7;--card:#fff;--fill:#e5e5ea;--ink:#121214;--mut:#6e6e76;--line:rgba(0,0,0,.08);--acc:#A0581A;--accs:rgba(160,88,26,.14);--onacc:#fff;--glass:rgba(255,255,255,.72);--sh:0 6px 24px rgba(0,0,0,.10);--cof:#2a2520}
:root[data-theme="dark"],:root[data-theme="abstract"]{--bg:#000;--card:#1c1c1e;--fill:#2c2c2e;--ink:#f5f5f7;--mut:#98989f;--line:rgba(255,255,255,.09);--acc:#DDA05A;--accs:rgba(221,160,90,.16);--onacc:#170C06;--glass:rgba(28,28,30,.72);--sh:0 8px 30px rgba(0,0,0,.5);--cof:#2a2520;color-scheme:dark}
:root[data-theme="abstract"]{--bg:#0b0816;--card:rgba(255,255,255,.06);--fill:rgba(255,255,255,.09)}
:root[data-theme="abstract"] body{background:radial-gradient(40vmax 40vmax at 10% 5%,#7B5CFF44,transparent 70%),radial-gradient(35vmax 35vmax at 95% 30%,#FF4FA333,transparent 70%),#0b0816;background-attachment:fixed}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
#pg{padding:calc(env(safe-area-inset-top) + 8px) 0 150px;max-width:1000px;margin:0 auto;min-height:100vh}
.vw[hidden]{display:none}
/* ---- barre du bas : repliée (1 onglet) → étendue (3 onglets) ; recherche = le bouton rond devient un champ ---- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:0 16px max(6px,calc(env(safe-area-inset-bottom) - 18px));pointer-events:none}
.tbw{display:flex;justify-content:space-between;gap:10px;max-width:560px;margin:0 auto;--ease:cubic-bezier(.32,.72,0,1)}
#tabs,#sr{pointer-events:auto;height:66px;border-radius:33px;flex:none;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(2);backdrop-filter:blur(30px) saturate(2);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.14);transition:width .42s var(--ease)}
#tabs{display:flex;padding:5px;overflow:hidden;width:114px}
.tbw[data-s=o] #tabs{width:calc(100% - 76px)}
.tbw[data-s=s] #tabs{width:66px}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 1 0;min-width:0;opacity:0;border-radius:28px;overflow:hidden;white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--ink);transition:flex-grow .42s var(--ease),opacity .25s,background .25s,color .25s}
#tabs button .i{width:26px;height:26px}
#tabs button span{margin-top:3px;max-height:16px;transition:opacity .2s,max-height .3s,margin .3s}
#tabs button[aria-selected=true]{flex-grow:1;opacity:1;background:color-mix(in srgb,var(--ink) 13%,transparent)}
.tbw[data-s=o] #tabs button{flex-grow:1;opacity:1}
.tbw[data-s=o] #tabs button[aria-selected=true]{color:var(--acc)}
.tbw[data-s=s] #tabs button[aria-selected=true]{background:transparent}
.tbw[data-s=s] #tabs button span{opacity:0;max-height:0;margin-top:0}
#sr{position:relative;width:66px;overflow:hidden}
.tbw[data-s=s] #sr{width:calc(100% - 76px)}
#srB{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .2s}
#srB .i{width:27px;height:27px}
.tbw[data-s=s] #srB{opacity:0;pointer-events:none}
#srF{position:absolute;inset:0;display:flex;align-items:center;gap:9px;padding:0 10px 0 18px;opacity:0;pointer-events:none;transition:opacity .2s}
.tbw[data-s=s] #srF{opacity:1;pointer-events:auto;transition:opacity .3s .12s}
#srF .i{width:21px;height:21px;color:var(--ink)}
#srI{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:17px Inter,-apple-system,sans-serif;-webkit-appearance:none;appearance:none}
#srI::placeholder{color:var(--mut)}#srI::-webkit-search-cancel-button{display:none}
#srM{display:grid;place-items:center;width:38px;height:38px;color:var(--ink)}#srM .i{width:20px;height:20px;color:var(--ink)}
/* ---- Compte ---- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:2147483600;background:rgba(30,30,32,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;max-width:88vw}
#vAcc{padding:6px 16px 0}
#vAcc>*{max-width:640px;margin-left:auto;margin-right:auto}
#vAcc h1{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:6px 0 6px}
.card{background:var(--card);border-radius:12px;overflow:hidden}
#vAcc h3{font-size:13px;text-transform:uppercase;color:var(--mut);font-weight:500;margin:24px 16px 6px}
.srow,.pb,.em{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px;border-bottom:.5px solid var(--line);width:100%;text-align:left}
.srow>span,.pb>span{flex:1}.srow small,.pb small{display:block;color:var(--mut);font-size:13px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--onacc);font-style:normal;font-size:13px;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}.av.o{background:var(--bg);color:var(--acc)}.av svg{width:20px;height:20px}
.pb svg{width:20px;height:20px;color:var(--acc)}
.ab{background:var(--bg);border:0;border-radius:8px;padding:7px 11px;font-size:14px;color:var(--acc)}
select.ab{appearance:auto}
.danger{color:#ff3b30!important}
.ver{color:var(--mut);font-size:13px;text-align:center;margin-top:18px}

.lcin{margin:22px 0 0;padding:34px 24px 30px;border-radius:28px;background:var(--card);border:1px solid var(--line);text-align:center;display:flex;flex-direction:column;align-items:center;overflow:visible}
.lcin .lcm{width:30px;height:64px}
.lcin b{font-size:26px;letter-spacing:-.01em;margin:18px 0 8px;line-height:1.2}
.lcin p{margin:0 0 24px;color:var(--mut);font-size:15px;line-height:1.5;max-width:300px}
.lcgo{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:340px;height:56px;border:0;border-radius:28px;background:var(--ink);color:var(--bg);font:600 16px inherit;font-family:inherit;cursor:pointer}
.lcgo:active{transform:scale(.98)}.lcgo .lcm{width:11px;height:24px}
.lcadd{margin:10px 16px}
.dlg{position:fixed;inset:0;z-index:2147483500;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.dlg>div{background:var(--card);background:var(--bg);border-radius:18px;padding:20px;width:min(92vw,360px);display:grid;gap:12px}
.dlg input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dlg button{background:var(--acc);color:var(--onacc);border-radius:10px;padding:11px;font-weight:600}
/* ---- Librairie : cartes pleine largeur façon App Store (une carte = une bande) ---- */
#vLib{padding:6px 16px 0}#vLib>*{max-width:640px;margin-left:auto;margin-right:auto}
#vLib h1{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:6px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 auto 4px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:7px 15px;font-size:14px;font-weight:500;background:var(--fill);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.ls{margin:28px 4px 14px}.ls h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}.ls p{margin:2px 0 0;font-size:15px;color:var(--mut)}
#vLib{position:relative}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 12px}.hd h1{margin:0!important}
.rb{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--fill);color:var(--ink);flex:none}.rb .i{width:20px;height:20px}.rb[aria-expanded=true]{background:var(--ink);color:var(--bg)}
.fm{position:absolute;right:16px;top:58px;z-index:30;width:min(78vw,290px);background:var(--card);border:.5px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.fm[hidden]{display:none}
.fr{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;text-align:left;border-bottom:.5px solid var(--line);font-size:16px;color:var(--ink)}.fr:last-child{border:0}
.fr span{flex:1}.fr small{display:block;font-size:12.5px;color:var(--mut)}.fr .i{width:18px;height:18px;color:var(--acc)}.fr[aria-checked=true]{font-weight:600}
.lp{margin:18px 4px 12px!important}.lp h2{font-size:18px!important}
#vLib .bc{display:flex;flex-direction:column;border-radius:26px;overflow:hidden;background:#161412;border:.5px solid var(--line);color:#fff;margin-bottom:24px;box-shadow:var(--sh)}
.bc .im{position:relative;display:flex;align-items:flex-end;min-height:360px;padding:20px 20px 18px;cursor:pointer;background:#222 center 30%/cover no-repeat}
/* brume : flou progressif + voile chaud sous le texte (façon Apple TV) */
.bc .im:after{content:"";position:absolute;left:0;right:0;bottom:0;height:70%;pointer-events:none;background:linear-gradient(to bottom,rgba(18,11,4,0),rgba(18,11,4,.5) 42%,rgba(14,9,4,.94));-webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 58%);mask-image:linear-gradient(to bottom,transparent,#000 58%)}
.bc .tx{position:relative;z-index:1;min-width:0;width:100%}
.bc .tx small{display:block;font-size:12.5px;font-weight:600;letter-spacing:.07em;color:rgba(255,255,255,.72);margin-bottom:6px}
.bc .tx b{display:block;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;overflow-wrap:anywhere}
.bc .tx span{display:block;font-size:15px;line-height:1.35;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc .st{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#2a2520}
